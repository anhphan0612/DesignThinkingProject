{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Dashboard{% endblock %} - Rentify</title>
    <link rel="stylesheet" href="{% static 'frontend/styles.css' %}?v=brand-1">
    <link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}?v=landlord-dashboard-4">
</head>
<body>
    <header class="site-topbar-shell dash-header">
        {% include "frontend/partials/topbar.html" %}
    </header>
    <main class="dash-shell">
        {% if messages %}
            <section class="messages">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
